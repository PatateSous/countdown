<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>.</title>
<style>
  @font-face {
    font-family: 'FFF Tusj';
    src: url('fonts/FFFTusj.woff') format('woff'),
         url('fonts/FFFTusj.ttf') format('truetype'),
         url('https://fonts.cdnfonts.com/s/14716/FFFTusj.woff') format('woff');
    font-weight: normal;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0a;
    --fg: #e8e4dc;
    --dim: #3a3830;
    --muted: #6b6660;
    --accent: #c8b89a;
    --red: #8b2e2e;
  }

  html, body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: 'FFF Tusj', 'Courier New', monospace;
    overflow-x: hidden;
  }

  html.fallback-font, body.fallback-font {
    font-family: 'Courier New', monospace !important;
  }

  html.custom-font, body.custom-font {
    font-family: 'FFF Tusj', 'Courier New', monospace !important;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.5rem;
    min-height: 100vh;
  }

  .comeback-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
  }

  .comeback-timer {
    font-size: clamp(32px, 10vw, 120px);
    color: var(--fg);
    letter-spacing: -0.01em;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    transition: color 2s;
    word-break: break-word;
    text-align: center;
    word-spacing: 0.1em;
  }

  .comeback-timer.near {
    color: var(--red);
    animation: pulse 1.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .comeback-sub {
    font-size: 13px;
    color: var(--dim);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-top: 0.3rem;
  }

  .font-control {
    position: fixed;
    top: 2rem;
    right: 2rem;
    display: flex;
    gap: 0.5rem;
    z-index: 100;
  }

  @media (max-width: 600px) {
    .font-control {
      top: auto;
      bottom: 2rem;
      right: 1rem;
    }
  }

  .font-btn {
    padding: 0.5rem 1rem;
    background: var(--dim);
    border: 1px solid var(--muted);
    color: var(--fg);
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: all 0.2s;
  }

  .font-btn:hover {
    background: var(--muted);
    color: var(--bg);
  }

  .font-btn.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }
</style>
</head>
<body>

<div class="font-control">
  <button class="font-btn active" data-font="FFF Tusj">Custom</button>
  <button class="font-btn" data-font="fallback">Fallback</button>
</div>

<div class="comeback-wrap">
  <span class="comeback-timer" id="comeback">--d --h --m --s ---ms</span>
  <span class="comeback-sub">August 15, 2026</span>
</div>

<script>
  const comeback = { id: 'comeback', date: new Date('2026-08-15T07:00:00') };

  function fmt(diff) {
    if (diff <= 0) return '00d 00h 00m 00s 000ms';
    const totalMs = Math.floor(diff);
    const ms = totalMs % 1000;
    const totalSec = Math.floor(totalMs / 1000);
    const s = totalSec % 60;
    const m = Math.floor(totalSec / 60) % 60;
    const h = Math.floor(totalSec / 3600) % 24;
    const d = Math.floor(totalSec / 86400);
    return `${String(d).padStart(2,'0')}d ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s ${String(ms).padStart(3,'0')}ms`;
  }

  function tick() {
    const now = Date.now();
    const cb = document.getElementById(comeback.id);
    if (cb) {
      const diff = comeback.date - now;
      cb.textContent = fmt(diff);
      if (diff < 7 * 24 * 3600 * 1000) cb.classList.add('near');
      else cb.classList.remove('near');
    }
  }

  tick();
  setInterval(tick, 50);

  const fontBtns = document.querySelectorAll('.font-btn');
  document.documentElement.classList.add('custom-font');
  document.body.classList.add('custom-font');

  fontBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const font = btn.dataset.font;
      fontBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (font === 'fallback') {
        document.documentElement.classList.remove('custom-font');
        document.documentElement.classList.add('fallback-font');
        document.body.classList.remove('custom-font');
        document.body.classList.add('fallback-font');
      } else {
        document.documentElement.classList.remove('fallback-font');
        document.documentElement.classList.add('custom-font');
        document.body.classList.remove('fallback-font');
        document.body.classList.add('custom-font');
      }
    });
  });
</script>
</body>
</html>
